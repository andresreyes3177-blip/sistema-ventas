name: Keep Supabase awake

# Le hace una consulta liviana a los dos proyectos de Supabase del Sistema de
# Ventas (Ventas y Logística) cada 3 días, para que el plan gratuito no los
# "duerma" por falta de uso — eso era lo que hacía tardar mucho la primera
# apertura del día. No toca datos ni credenciales sensibles: usa las mismas
# claves públicas (anon key) que ya están embebidas en el sistema.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Ventas
        run: |
          curl -s -o /dev/null -w "Ventas respondió: %{http_code}\n" \
            "https://xttbqcxyzlnajmamvuyt.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_QSiJWjtTLzDmZ7nO_kuH2Q_ZX0de2Tw"

      - name: Ping Supabase Logística
        run: |
          curl -s -o /dev/null -w "Logística respondió: %{http_code}\n" \
            "https://ucfseceuqcewyixlyivx.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjZnNlY2V1cWNld3lpeGx5aXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjI4ODMsImV4cCI6MjA5OTUzODg4M30.dyXsKCYenxz5_4lKkHlX_akAFqkN8FBE49hUMHdN-AY"
